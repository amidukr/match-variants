[package]
name = "match-variants"
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust procedural macros for applying the same expression to heterogeneous enum variants without a common trait."
repository = "https://github.com/amidukr/match-variants"
readme = "README.md"
keywords = ["enum", "macro", "proc-macro", "dispatch"]
categories = ["rust-patterns"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
trybuild = "1"
